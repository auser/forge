[workspace]
resolver = "3"
members = [
    "crates/forge-cli",
    "crates/forge-config",
    "crates/forge-core",
    "crates/forge-execution",
    "crates/forge-graph",
    "crates/forge-providers",
    "crates/forge-runtime",
    "crates/forge-server",
    "crates/forge-session",
    "crates/forge-skills",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-config = { path = "crates/forge-config" }
forge-execution = { path = "crates/forge-execution" }
forge-graph = { path = "crates/forge-graph" }
forge-providers = { path = "crates/forge-providers" }
forge-runtime = { path = "crates/forge-runtime" }
forge-server = { path = "crates/forge-server" }
forge-session = { path = "crates/forge-session" }
forge-skills = { path = "crates/forge-skills" }

async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
http-body-util = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serial_test = "3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
walkdir = "2"
wiremock = "0.6"
