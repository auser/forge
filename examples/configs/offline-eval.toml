# Zero dependencies: no model server, no router, no keys, no network.
# For evaluating Forge, CI pipelines, and the BDD suite.

model = "mock-local"          # deterministic built-in mock
router = "static"
execution = "native"
approval = "prompt"

# A scripted mock (replays queued replies incl. tool calls) is available too:
# model = "scripted-mock"
# mock_script = "mock-script.json"   # project-relative JSON file
