# Native Rust Laya: use Laya's typed-decision model without Python, Torch, or
# a localhost adapter. On its first route, Forge downloads the pinned ~847 MB
# `typed-decisions` checkpoint into its cache. Set `weights_path` to use a
# shared/custom location, or `autofetch = false` to require it in advance.

model = "qwen3-coder"
router = "laya-native"
router_fallback = "cheapest"  # missing weights / timeout / low confidence
router_confidence_threshold = 0.7
execution = "native"
approval = "prompt"

[laya]
# weights_path = "/absolute/path/to/laya/typed-decisions"
autofetch = true

[models.qwen3-coder]
description = "local coding model, free, good for routine edits and questions"
base_url = "http://127.0.0.1:8080/v1"
cost_input_per_mtok = 0.0
cost_output_per_mtok = 0.0
tools = true

[models.deepseek-chat]
description = "low-cost hosted model for general coding tasks"
base_url = "https://api.deepseek.com/v1"
key_env = "DEEPSEEK_API_KEY"
cost_input_per_mtok = 0.14
cost_output_per_mtok = 0.28
tools = true

[models.kimi-k2.7-code]
description = "frontier-quality coding model for hard debugging and refactors"
base_url = "https://api.moonshot.ai/v1"
key_env = "MOONSHOT_API_KEY"
cost_input_per_mtok = 0.95
cost_output_per_mtok = 4.00
tools = true
