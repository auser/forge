[package]
name = "needle-sys"
description = "Raw FFI bindings to libneedle, the Cactus Needle 3 on-device inference engine"
edition.workspace = true
version.workspace = true
license.workspace = true

# Only one crate in the dependency graph may link libneedle. The C API is a
# single process-global, non-thread-safe model (see needle.h), so a second
# linkage would be a second claim on the same global state.
links = "needle"

# No build-dependencies on purpose: the six `extern "C"` declarations are
# hand-written in src/lib.rs rather than generated, so build.rs needs no
# bindgen and therefore no libclang — which would otherwise become an
# undocumented prerequisite of every default workspace build.
