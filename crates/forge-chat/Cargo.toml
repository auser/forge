[package]
name = "forge-chat"
description = "Pure interactive-chat layer for Forge: slash parsing, transcript rendering and the input state machine, over the ChatIo/ChatHost seams"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
forge-runtime.workspace = true
forge-session.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Only for `testing.rs` (`ScriptedIo` + `FakeHost`), which builds a real
# `AgentService` over mock providers. Optional so a downstream crate can
# pull it in via the `testing` feature without forge-chat depending on
# these outside of tests; forge-chat's own `cargo test` gets them for free
# as dev-dependencies below, same as every other crate here.
forge-config = { workspace = true, optional = true }
forge-execution = { workspace = true, optional = true }
forge-providers = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
forge-config.workspace = true
forge-execution.workspace = true
forge-providers.workspace = true
tempfile.workspace = true

[features]
testing = ["forge-config", "forge-execution", "forge-providers", "tempfile"]
