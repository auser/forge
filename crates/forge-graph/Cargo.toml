[package]
name = "forge-graph"
description = "Deterministic, local, incremental project graph for Forge"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
walkdir.workspace = true

[dev-dependencies]
# Only the tests need these: `query`'s blend takes a `dyn Embedder` the
# caller built, so the crate itself stays model-free and async-runtime-free.
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
