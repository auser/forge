[package]
name = "forge-cli"
description = "Command-line interface for the Forge agentic coding harness"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

# Cucumber harness (custom main, not libtest).
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false

[features]
default = []
# Build the `forge` binary against the real libneedle engine. Off by default:
# it needs a per-platform `libneedle.a` that is not vendored in the repo (see
# crates/needle-sys/build.rs). Without it forge still routes — the needle
# router reports weights/engine unavailable and falls back to static rules.
needle-ffi = ["forge-needle/ffi"]

[dependencies]
forge-config.workspace = true
forge-core.workspace = true
forge-execution.workspace = true
forge-graph.workspace = true
forge-needle.workspace = true
forge-providers.workspace = true
forge-runtime.workspace = true
forge-server.workspace = true
forge-session.workspace = true
forge-skills.workspace = true
clap.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
cucumber = "0.21"
reqwest.workspace = true
serde_json.workspace = true
serial_test.workspace = true
sha2.workspace = true
tempfile.workspace = true
wiremock.workspace = true
