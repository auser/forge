[package]
name = "forge-needle"
description = "Embedded on-device AI backend for Forge: decide/embed/extract/tool-call behind a swappable engine"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# End-to-end tests against real weights (tests/e2e.rs). A test gate, not an
# engine gate: whether this build can run inference is a build-time fact
# (`HAS_EMBEDDED_BACKEND`), and these tests additionally need real weights —
# FORGE_NEEDLE_E2E_WEIGHTS; see README.
needle-e2e = []

[dependencies]
async-trait.workspace = true
forge-config.workspace = true
forge-core.workspace = true
needle-sys.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
wiremock.workspace = true
